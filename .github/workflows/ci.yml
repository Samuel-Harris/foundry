name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APM_VERSION: "0.32.0"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-only: the action must not install packages itself. The hook is
      # the only install, and it is what detects a stale lockfile.
      - name: Set up APM ${{ env.APM_VERSION }}
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: ${{ env.APM_VERSION }}

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            export FOUNDRY_DIFF_RANGE="origin/${BASE_REF}...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            export FOUNDRY_DIFF_RANGE="${BEFORE}...HEAD"
          else
            export FOUNDRY_CHECK_ALL=1
          fi
          .githooks/pre-commit

  versions:
    name: Package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run versioning tests
        run: python3 -m unittest discover -s tests/versioning

      # On a push, checking against the previous tip catches two PRs that
      # merged the same bump.
      - name: Check changed packages are bumped
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            python3 scripts/versioning.py check "origin/${BASE_REF}"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/versioning.py check "$BEFORE"
          else
            echo "No base to compare against; skipping the version check."
          fi

  tag:
    name: Tag package versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pre-commit, versions, statechart-tests, poteto-mode-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and push new package versions
        run: |
          set -euo pipefail
          git fetch --tags origin
          tags="$(python3 scripts/versioning.py tag)"
          if [[ -z "$tags" ]]; then
            echo "No new package versions to tag."
            exit 0
          fi
          refs=()
          for tag in $tags; do
            refs+=("refs/tags/${tag}")
          done
          printf 'Pushing %s\n' "${refs[@]}"
          git push --atomic origin "${refs[@]}"

  statechart-tests:
    name: pstack statechart tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pstack/tests/statechart
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The statechart runtime pins TLC 1.7.4 and Temurin 25 (see run.ts).
      # Providing both up front stops the TLC tests from skipping.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download TLC 1.7.4
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  poteto-mode-tests:
    name: pstack poteto-mode tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pstack
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:poteto-mode

      - name: Run tests
        run: bun run test:poteto-mode
