name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APM_VERSION: "0.32.0"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-only: the action must not install packages itself. The hook is
      # the only install, and it is what detects a stale lockfile.
      - name: Set up APM ${{ env.APM_VERSION }}
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: ${{ env.APM_VERSION }}

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            export FOUNDRY_DIFF_RANGE="origin/${BASE_REF}...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            export FOUNDRY_DIFF_RANGE="${BEFORE}...HEAD"
          else
            export FOUNDRY_CHECK_ALL=1
          fi
          .githooks/pre-commit

  statechart-tests:
    name: pstack statechart tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pstack/tests/statechart
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The statechart runtime pins TLC 1.7.4 and Temurin 25 (see run.ts).
      # Providing both up front stops the TLC tests from skipping.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download TLC 1.7.4
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test
