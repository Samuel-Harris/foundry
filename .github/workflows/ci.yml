name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APM_VERSION: "0.32.0"

jobs:
  # Manual runs skip the filter, so every job runs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      versions: ${{ steps.filter.outputs.versions }}
      statechart: ${{ steps.filter.outputs.statechart }}
      poteto-mode: ${{ steps.filter.outputs.poteto-mode }}
    steps:
      - uses: dorny/paths-filter@v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            versions:
              - .github/workflows/ci.yml
              - scripts/versioning.py
              - scripts/relativise_lockfiles.py
              - scripts/pstack_upstream.py
              - tests/versioning/**
              - tests/pstack_upstream/**
              - packages/*/apm.yml
              - packages/*/apm.lock.yaml
              - packages/*/.apm/**
            statechart:
              - .github/workflows/ci.yml
              - packages/p-stack/tests/statechart/**
              - packages/p-stack/.apm/skills/statechart/**
            poteto-mode:
              - .github/workflows/ci.yml
              - packages/p-stack/package.json
              - packages/p-stack/bun.lock
              - packages/p-stack/tsconfig.poteto-mode.json
              - packages/p-stack/tests/poteto-mode/**
              - packages/p-stack/.apm/skills/poteto-mode/**

  # Unfiltered: the hook scopes itself to the diff, and its conflict-marker
  # scan covers every tracked file.
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-only: the action must not install packages itself. The hook is
      # the only install, and it is what detects a stale lockfile.
      - name: Set up APM ${{ env.APM_VERSION }}
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: ${{ env.APM_VERSION }}

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            export FOUNDRY_DIFF_RANGE="origin/${BASE_REF}...HEAD"
          else
            export FOUNDRY_CHECK_ALL=1
          fi
          .githooks/pre-commit

  versions:
    name: Package versions
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run versioning tests
        run: python3 -m unittest discover -s tests/versioning

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"

      - name: Run pstack upstream tests
        run: uv run --script tests/pstack_upstream/test_pstack_upstream.py

      - name: Check changed packages are bumped
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            python3 scripts/versioning.py check "origin/${BASE_REF}"
          else
            echo "No base to compare against; skipping the version check."
          fi

  # The one required check on main. A job whose dependency failed is skipped,
  # and a skipped job counts as passing, so this must run always() and read
  # every result itself.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, pre-commit, versions, statechart-tests, poteto-mode-tests, data-visualisation-tools-tests, foundry-maintenance-tests, s-stack-launcher-tests, claude-code-usage-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded or was filtered out
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  statechart-tests:
    name: p-stack statechart tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.statechart == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/p-stack/tests/statechart
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The statechart runtime pins TLC 1.7.4 and Temurin 25 (see run.ts).
      # Providing both up front stops the TLC tests from skipping.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download TLC 1.7.4
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  poteto-mode-tests:
    name: p-stack poteto-mode tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.poteto-mode == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/p-stack
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:poteto-mode

      - name: Run tests
        run: bun run test:poteto-mode

  data-visualisation-tools-tests:
    name: data-visualisation tools tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"

      # --frozen fails on a drifted uv.lock instead of quietly re-locking.
      - name: Run tests
        run: uv run --frozen --package data-visualisation-tools python -m unittest discover -s packages/data-visualisation/tools/tests

  foundry-maintenance-tests:
    name: foundry-maintenance script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s packages/foundry-maintenance/tests

  s-stack-launcher-tests:
    name: s-stack launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Ubuntu runner images do not list tmux.
      - name: Install tmux
        run: command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }

      - name: Run tests
        run: python3 -m unittest discover -s packages/s-stack/tests

  claude-code-usage-tests:
    name: claude-code-usage script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s packages/claude-code-usage/tests
