name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APM_VERSION: "0.32.0"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-only: the action must not install packages itself. The hook is
      # the only install, and it is what detects a stale lockfile.
      - name: Set up APM ${{ env.APM_VERSION }}
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: ${{ env.APM_VERSION }}

      - name: Run pre-commit checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            export FOUNDRY_DIFF_RANGE="origin/${BASE_REF}...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            export FOUNDRY_DIFF_RANGE="${BEFORE}...HEAD"
          else
            export FOUNDRY_CHECK_ALL=1
          fi
          .githooks/pre-commit
