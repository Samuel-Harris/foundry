name: default-stack
version: "0.1.0"
description: "Meta-package that installs the default Foundry stack."
author: sam
license: MIT
repository: https://github.com/Samuel-Harris/foundry
targets:
  - cursor
  - claude
  - copilot
includes: auto
dependencies:
  apm:
    - path: ../coding-style
    - path: ../execution
    - path: ../git-diff
    - path: ../planning
    - path: ../pr
    - path: ../repo-maintenance
    - path: ../review
    - path: ../skill-creation
scripts:
  check: apm audit --ci
