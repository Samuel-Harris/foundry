name: foundry-default-stack
version: "0.1.0"
description: "Meta-package that installs the default Foundry stack."
author: sam
license: MIT
repository: https://github.com/Samuel-Harris/foundry
targets:
  - cursor
  - claude
  - copilot
includes: auto
dependencies:
  apm:
    - path: ../foundry-coding-style
    - path: ../foundry-execution
    - path: ../foundry-git-diff
    - path: ../foundry-planning
    - path: ../foundry-pr
    - path: ../foundry-repo-maintenance
    - path: ../foundry-review
    - path: ../foundry-skill-creation
scripts:
  check: apm audit --ci
